# Source of truth: SCRIPTS/githubactions. Generated copies are overwritten.
name: openclaw-deterministic-latest build_asset

on:
  workflow_call:
    inputs:
      core_source_commit:
        description: Immutable Core-pre source of truth
        type: string
        required: true
      patch_source_commit:
        description: Exact Deterministic patch/workflow source
        type: string
        required: true
      publish:
        description: Publish the tested runtime bundle
        type: boolean
        default: false
      target_version:
        description: Optional OpenClaw version to build before Core-pre records it
        type: string
        required: false
        default: ''
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      upstream_sha:
        value: ${{ jobs.build.outputs.upstream_sha }}
      release_tag:
        value: ${{ jobs.build.outputs.release_tag }}
    secrets:
      source_token:
        required: true

permissions:
  contents: write

concurrency:
  group: openclaw-deterministic-release
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.core.outputs.version }}
      upstream_sha: ${{ steps.core.outputs.upstream_sha }}
      release_tag: ${{ steps.core.outputs.release_tag }}
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Check out patch source
        uses: actions/checkout@v4
        with:
          repository: safrano9999/openclaw-deterministic-latest
          token: ${{ secrets.source_token }}
          ref: ${{ inputs.patch_source_commit }}

      - name: Check out immutable Core source of truth
        uses: actions/checkout@v4
        with:
          repository: safrano9999/fedora45-ai-safrano9999
          ref: ${{ inputs.core_source_commit }}
          token: ${{ secrets.source_token }}
          path: core-source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read target and Ephemeral source from Core-pre
        id: core
        env:
          GH_TOKEN: ${{ secrets.source_token }}
          CORE_COMMIT: ${{ inputs.core_source_commit }}
          PATCH_COMMIT: ${{ inputs.patch_source_commit }}
          TARGET_OPENCLAW_VERSION: ${{ inputs.target_version }}
        run: |
          [[ "$CORE_COMMIT" =~ ^[0-9a-f]{40}$ && "$PATCH_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$(git -C core-source rev-parse HEAD)" = "$CORE_COMMIT"
          test "$(git rev-parse HEAD)" = "$PATCH_COMMIT"
          python3 .github/scripts/read-core-pins.py core-source build.conf >> "$GITHUB_OUTPUT"
          printf 'CORE_SOURCE_COMMIT=%s\n' "$CORE_COMMIT" >> build.conf

      - name: Load exact pins
        if: steps.core.outputs.needs_build == 'true'
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source build.conf
          set +a
          [[ "$OPENCLAW_VERSION" =~ ^[0-9]{4}[.][0-9]+[.][0-9]+([-][A-Za-z0-9.]+)?$ ]]
          [[ "$OPENCLAW_UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$OPENCLAW_PATCH_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OPENCLAW_PATCH_FILE" =~ ^patches/openclaw-[0-9.]+-deterministic(-main)?[.]patch$ ]]
          [[ "$OPENCLAW_BUILD_LABEL" == "${OPENCLAW_VERSION}-patched" ]]
          release_prefix="${OPENCLAW_VERSION}-deterministic."
          [[ "$OPENCLAW_DETERMINISTIC_RELEASE_TAG" == "$release_prefix"* ]]
          [[ "${OPENCLAW_DETERMINISTIC_RELEASE_TAG#"$release_prefix"}" =~ ^[0-9]+$ ]]
          [[ "$OPENCLAW_DETERMINISTIC_ASSET" == "openclaw-${OPENCLAW_VERSION}-deterministic.tar.gz" ]]
          [[ "$OPENCLAW_PNPM_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          [[ "$OPENCLAW_NODE_VERSION" =~ ^[0-9]+[.][0-9]+[.][0-9]+$ ]]
          test -s "$OPENCLAW_PATCH_FILE"
          actual_patch_sha="$(sha256sum "$OPENCLAW_PATCH_FILE" | cut -d' ' -f1)"
          test "$actual_patch_sha" = "$OPENCLAW_PATCH_SHA256"
          {
            printf 'version=%s\n' "$OPENCLAW_VERSION"
            printf 'upstream_sha=%s\n' "$OPENCLAW_UPSTREAM_SHA"
            printf 'patch=%s\n' "$OPENCLAW_PATCH_FILE"
            printf 'release_tag=%s\n' "$OPENCLAW_DETERMINISTIC_RELEASE_TAG"
            printf 'asset=%s\n' "$OPENCLAW_DETERMINISTIC_ASSET"
            printf 'pnpm_version=%s\n' "$OPENCLAW_PNPM_VERSION"
            printf 'node_version=%s\n' "$OPENCLAW_NODE_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Check out pinned OpenClaw source
        if: steps.core.outputs.needs_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ steps.pins.outputs.upstream_sha }}
          fetch-depth: 1
          path: upstream

      - name: Verify pin and apply patch
        if: steps.core.outputs.needs_build == 'true'
        shell: bash
        env:
          OPENCLAW_VERSION: ${{ steps.pins.outputs.version }}
          OPENCLAW_UPSTREAM_SHA: ${{ steps.pins.outputs.upstream_sha }}
          OPENCLAW_PNPM_VERSION: ${{ steps.pins.outputs.pnpm_version }}
          OPENCLAW_PATCH: ${{ steps.pins.outputs.patch }}
        run: |
          set -euo pipefail
          actual_version="$(node -p "require('./upstream/package.json').version")"
          test "$actual_version" = "$OPENCLAW_VERSION"
          test "$(git -C upstream rev-parse HEAD)" = "$OPENCLAW_UPSTREAM_SHA"
          node -e 'const pkg = require("./upstream/package.json"); if (pkg.packageManager.split("+")[0] !== `pnpm@${process.env.OPENCLAW_PNPM_VERSION}`) process.exit(1)'
          git -C upstream apply --check "$GITHUB_WORKSPACE/$OPENCLAW_PATCH"
          git -C upstream apply "$GITHUB_WORKSPACE/$OPENCLAW_PATCH"

      - name: Set up exact pnpm
        if: steps.core.outputs.needs_build == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.pins.outputs.pnpm_version }}
          run_install: false

      - name: Set up Node
        if: steps.core.outputs.needs_build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.pins.outputs.node_version }}
          cache: pnpm
          cache-dependency-path: upstream/pnpm-lock.yaml

      - name: Test runtime bundle identity
        if: steps.core.outputs.needs_build == 'true'
        run: |
          python3 .github/scripts/test-read-core-pins.py
          python3 .github/scripts/test-package-runtime.py

      - name: Install exact dependencies
        if: steps.core.outputs.needs_build == 'true'
        working-directory: upstream
        run: pnpm install --frozen-lockfile

      - name: Run deterministic contract tests
        if: steps.core.outputs.needs_build == 'true'
        working-directory: upstream
        run: |
          tests=( \
            src/agents/deterministic-gateway-model.test.ts \
            src/agents/model-auth-availability.test.ts \
            src/agents/model-auth-availability.deterministic.test.ts \
            src/agents/model-catalog-decisions.test.ts \
            src/agents/mcp-transport-config.test.ts \
            src/agents/mcp-transport.test.ts \
            src/auto-reply/reply/directive-handling.defaults.test.ts \
            src/auto-reply/reply/agent-runner-direct-runtime-config.test.ts \
            src/plugins/before-agent-reply.test.ts \
            src/agents/embedded-agent-runner/run.shared-integration.test.ts \
            src/agents/model-catalog.test.ts \
            src/agents/model-catalog.planning.test.ts \
            src/agents/mcp-http-fetch.test.ts \
            src/config/schema.test.ts \
            test/scripts/runtime-postbuild.test.ts \
            src/commands/auth-choice.model-check.test.ts \
            src/commands/models/list.rows.activation.test.ts \
            src/plugins/providers.runtime.activation.test.ts \
            src/plugins/provider-model-routes.cache.test.ts \
            src/plugins/provider-policy-surface.test.ts \
            src/plugins/provider-hook-runtime.provenance.test.ts \
            src/plugins/providers.runtime.owner-completeness.test.ts \
            src/plugins/providers.runtime.consult-current-snapshot.test.ts \
            src/config/plugin-auto-enable.core.test.ts \
            src/commands/model-picker.test.ts \
            src/agents/prepared-model-catalog-worker.pool.integration.test.ts \
            src/agents/prepared-model-catalog-worker.secrets.test.ts \
            extensions/codex/src/session-catalog-backoff.test.ts \
            extensions/codex/src/session-catalog-index-events.test.ts \
            extensions/codex/src/session-catalog-index.test.ts \
          )
          existing=()
          for test in "${tests[@]}"; do
            [[ -f "$test" ]] && existing+=("$test")
          done
          ((${#existing[@]} > 0))
          node scripts/run-vitest.mjs "${existing[@]}" --maxWorkers=4

      - name: Build OpenClaw
        if: steps.core.outputs.needs_build == 'true'
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        working-directory: upstream
        run: pnpm build

      - name: Verify built compatibility assets
        if: steps.core.outputs.needs_build == 'true'
        working-directory: upstream
        run: |
          cmp src/agents/deterministic-gateway-replies.txt dist/deterministic-gateway-replies.txt
          node openclaw.mjs --version
          node scripts/check-package-dist-imports.mjs .

      - name: Pack the complete pinned OpenClaw runtime
        if: steps.core.outputs.needs_build == 'true'
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          node scripts/package-openclaw-for-docker.mjs \
            --skip-build --allow-unreleased-changelog \
            --output-dir "$GITHUB_WORKSPACE/packed" --output-name openclaw.tgz

      - name: Check out Ephemeral selected by Core
        if: steps.core.outputs.needs_build == 'true'
        uses: actions/checkout@v4
        with:
          repository: safrano9999/openclaw-ephemeral
          ref: ${{ steps.core.outputs.ephemeral_sha }}
          path: ephemeral

      - name: Test Ephemeral against the built Core-pre selection
        if: steps.core.outputs.needs_build == 'true'
        env:
          UPGRADE_TARGET_SOURCE: ${{ github.workspace }}/upstream
          UPGRADE_TARGET_PACKAGE: ${{ runner.temp }}/selected-runtime/node_modules/openclaw
          UPGRADE_TARGET_VERSION: ${{ steps.pins.outputs.version }}
          UPGRADE_TARGET_UPSTREAM_SHA: ${{ steps.pins.outputs.upstream_sha }}
          PYTHONPATH: ${{ github.workspace }}/ephemeral
        run: |
          npm install --prefix "$RUNNER_TEMP/selected-runtime" --ignore-scripts --omit=dev \
            --no-audit --no-fund "$GITHUB_WORKSPACE/packed/openclaw.tgz"
          python3 -m unittest discover -s ephemeral/tests -v
          python3 core-source/upgrade-loop/probes/openclaw_config.py

      - name: Package release assets
        if: steps.core.outputs.needs_build == 'true'
        shell: bash
        env:
          DIST_ASSET: ${{ steps.pins.outputs.asset }}
          PATCH_FILE: ${{ steps.pins.outputs.patch }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 .github/scripts/package-runtime.py \
            packed/openclaw.tgz build.conf "artifacts/$DIST_ASSET"
          patch_asset="$(basename -- "$PATCH_FILE")"
          cp -- "$PATCH_FILE" "artifacts/$patch_asset"
          cp build.conf artifacts/build.conf
          (
            cd artifacts
            sha256sum "$DIST_ASSET" > "$DIST_ASSET.sha256"
            sha256sum "$patch_asset" > "$patch_asset.sha256"
          )

      - name: Upload verified build artifacts
        if: steps.core.outputs.needs_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-${{ steps.pins.outputs.version }}-deterministic
          path: artifacts/
          if-no-files-found: error

      - name: Publish version-pinned release
        if: inputs.publish == true && steps.core.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.source_token }}
          OPENCLAW_VERSION: ${{ steps.pins.outputs.version }}
          OPENCLAW_UPSTREAM_SHA: ${{ steps.pins.outputs.upstream_sha }}
          GH_REPO: safrano9999/openclaw-deterministic-latest
          PATCH_COMMIT: ${{ inputs.patch_source_commit }}
          RELEASE_TAG: ${{ steps.pins.outputs.release_tag }}
          BUILD_FINGERPRINT: ${{ steps.core.outputs.fingerprint }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="OpenClaw ${OPENCLAW_VERSION} deterministic patch"
          notes="Pinned OpenClaw ${OPENCLAW_VERSION} deterministic patch and complete OpenClaw runtime bundle. Plugins are installed by consumers in later layers. Upstream source: ${OPENCLAW_UPSTREAM_SHA}. Build fingerprint: ${BUILD_FINGERPRINT}."
          gh release create "$tag" artifacts/* --target "$PATCH_COMMIT" \
            --title "$title" --notes "$notes" --latest=false

      - name: Publish latest release
        if: inputs.publish == true && steps.core.outputs.needs_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.source_token }}
          OPENCLAW_VERSION: ${{ steps.pins.outputs.version }}
          OPENCLAW_UPSTREAM_SHA: ${{ steps.pins.outputs.upstream_sha }}
          GH_REPO: safrano9999/openclaw-deterministic-latest
          PATCH_COMMIT: ${{ inputs.patch_source_commit }}
        shell: bash
        run: |
          set -euo pipefail
          tag=latest
          notes="Latest OpenClaw ${OPENCLAW_VERSION} deterministic patch and complete runtime bundle. Upstream source: ${OPENCLAW_UPSTREAM_SHA}. Patch source: ${PATCH_COMMIT}."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --clobber
            gh release edit "$tag" --title "$tag" --notes "$notes" --latest
          else
            gh release create "$tag" artifacts/* \
              --target "$(git rev-parse HEAD)" \
              --title "$tag" \
              --notes "$notes" \
              --latest
          fi
